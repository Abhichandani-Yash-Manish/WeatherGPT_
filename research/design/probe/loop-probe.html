<!doctype html><html><head><meta charset="utf-8"><style>
:root{--paper:#eef0f6;--ink:#151a2a;--violet:#4b2e83}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui;padding:48px}
h1{font-size:44px;margin:0 0 8px}
.v{font-family:ui-monospace;font-size:34px;color:var(--violet)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.card{background:#fff;border:1px solid rgba(21,26,42,.14);border-radius:14px;padding:16px;min-height:120px}
</style></head><body>
<h1>Loop probe</h1><p>A governed value: <span class="v">31.4 °C</span></p>
<div class="grid"><div class="card">one</div><div class="card">two</div><div class="card">three</div></div>
</body></html>
