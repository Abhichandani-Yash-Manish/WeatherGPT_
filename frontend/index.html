<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="workspace-token" content="__WORKSPACE_TOKEN__" />
    <meta name="color-scheme" content="light dark" />
    <!-- The colour the browser paints its own chrome with, before the page has run. Each value is a ground
         this product actually draws, read from the hour tokens: daybreak is #fdfaf6 and the night ground is
         #0a0f1a. It is keyed on the operating system here because a static file cannot know the hour, which is
         why the real fix is the runtime update below the hour that is resolved - see docs/123. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfaf6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0f1a" />
    <meta
      name="description"
      content="WeatherGPT: a local, evidence-first conversational weather workspace for India. Every value keeps its source, its window and the time it was retrieved."
    />
    <!-- The mark is drawn from the product, not from a marketing palette: a horizon under a measured
         sky, in the data teal. It is an inline data URI so the page loads nothing off-origin. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d6d77'/%3E%3Cpath d='M6 20h20' stroke='%23ffffff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M10 20a6 6 0 0 1 12 0' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='11' r='2.6' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <!-- The installable app: the manifest and the worker are what make a phone treat this as an
         application rather than a page, and what make an official warning able to reach it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WeatherGPT" />
    <title>WeatherGPT</title>
  </head>
  <body>
    <div id="root" data-boot="react">
      <noscript>
        WeatherGPT answers from a local evidence store and needs JavaScript to render an answer. The API stays
        available on this machine, and the vanilla surface is served with: python3 -m weathergpt_data.workspace
        --frontend legacy
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
