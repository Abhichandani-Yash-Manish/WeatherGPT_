<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="workspace-token" content="__WORKSPACE_TOKEN__" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ecf0ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1216" />
    <meta
      name="description"
      content="WeatherGPT: a local, evidence-first conversational weather workspace for India. Every value keeps its source, its window and the time it was retrieved."
    />
    <!-- The mark is drawn from the product, not from a marketing palette: a horizon under a measured
         sky, in the data teal. It is an inline data URI so the page loads nothing off-origin. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d6d77'/%3E%3Cpath d='M6 20h20' stroke='%23ffffff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M10 20a6 6 0 0 1 12 0' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='11' r='2.6' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <title>WeatherGPT</title>
  </head>
  <body>
    <div id="root" data-boot="react">
      <noscript>
        WeatherGPT answers from a local evidence store and needs JavaScript to render an answer. The API stays
        available on this machine, and the vanilla surface is served with: python3 -m weathergpt_data.workspace
        --frontend legacy
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
